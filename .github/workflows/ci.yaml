name: CI Pipeline

# Full pipeline (same chain as the RAG project):
#   experiment      -> run the agent eval on all goldens (experiment pipeline)
#                      (creates a new MLflow run on DagsHub tagged stage=challenger)
#   regression-test -> no metric more than 2 x noise below the champion (thresholds.json)
#   promotion-test  -> majority vote: >= 3/4 metrics >= champion, none beyond the noise
#   promote         -> challenger -> champion, old champion -> archived
#   both gates auto-reject (clear the stage=challenger tag) on failure.

on:
  push:
    branches: [main]
    paths:
      - params.yaml
  # prompts live in Langfuse, so a prompt change pushes no file: run it by hand
  workflow_dispatch:

# The later stages change shared MLflow `stage` tags on DagsHub, so never let
# two pipeline runs overlap.
concurrency:
  group: ci-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  experiment:
    name: Run agent eval experiment
    runs-on: ubuntu-latest
    # ~30 executor visits per screening golden + 4 metrics per golden: long-running.
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # dagshub.init() reads this and wires up MLflow auth against DagsHub.
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
      # Jev (TypeSafe) makes every guardrail decision; without it the guards fail closed.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      # Langfuse is still used to fetch prompts, but the eval runs send no traces: the
      # guard spans have no root span here, so each one would become its own trace.
      LANGFUSE_TRACING_ENABLED: "false"
      # No interactive prompt / phone-home from DeepEval in CI.
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Same settings as the local ~/.guardrailsrc: no Guardrails telemetry, validators run locally.
      - name: Configure Guardrails AI
        run: printf 'enable_metrics=false\nuse_remote_inferencing=false\n' > ~/.guardrailsrc

      - name: Run experiment pipeline
        run: uv run python -m hiring_agent.experimentation.execute_experiment_pipeline | tee pipeline.log

      - name: Show new challenger run
        if: success()
        run: |
          echo "### New challenger run" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A1 "MLflow run:" pipeline.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  regression-test:
    name: Regression gate
    # Only runs if every step of `experiment` passed.
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The gate only reads metrics already logged to MLflow; no OpenAI /
      # Jev / Langfuse needed. dagshub.init() needs just the token.
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run regression gate
        id: regression
        run: uv run pytest tests/test_regression.py -v

      - name: Reject challenger on regression failure
        if: always() && steps.regression.outcome == 'failure'
        run: uv run python -m hiring_agent.experimentation.reject_challenger

  promotion-test:
    name: Promotion gate
    # Linear chain: this running means the regression gate passed, which in
    # turn means the experiment job passed -- so reaching the promote stage
    # requires BOTH gates green.
    needs: regression-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run promotion gate
        id: promotion
        # -s shows the BETTER / NOISE / FAIL line per metric in the log
        run: uv run pytest tests/test_promotion.py -v -s

      - name: Reject challenger on promotion failure
        if: always() && steps.promotion.outcome == 'failure'
        run: uv run python -m hiring_agent.experimentation.reject_challenger

  promote:
    name: Promote challenger to champion
    # Reached only when both gates are green (linear chain). No auto-reject
    # here: a failed tag-swap is an infra problem to retry, not grounds to
    # discard a challenger that already passed both gates.
    needs: promotion-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Promote challenger
        run: |
          echo '### Promotion result' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run python -m hiring_agent.experimentation.promote_challenger | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
