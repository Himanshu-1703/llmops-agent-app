[project]
name = "llmops-agent-app"
version = "0.1.0"
description = "Hiring Assistant agent - a plan-and-execute LangGraph agent used to teach an LLMOps pipeline"
readme = "README.md"
authors = [
    { name = "Himanshu Arora", email = "himanshu1703@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.8",
    "langchain>=1.3.10",
    "langchain-openai>=1.3.2",
    "langfuse>=4.17.0",
    "langgraph>=1.2.6",
    "python-dotenv>=1.2.2",
    "streamlit>=1.62.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# the package folder is src/hiring_agent, which differs from the project name
[tool.uv.build-backend]
module-name = "hiring_agent"
