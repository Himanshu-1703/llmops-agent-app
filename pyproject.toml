[project]
name = "llmops-agent-app"
version = "0.1.0"
description = "Hiring Assistant agent - a plan-and-execute LangGraph agent used to teach an LLMOps pipeline"
readme = "README.md"
authors = [
    { name = "Himanshu Arora", email = "himanshu1703@gmail.com" }
]
requires-python = ">=3.12"
# Only what the agent and the API need: this is all the API Docker image installs
# (`uv sync --no-default-groups`). Eval and frontend packages are in the groups below.
dependencies = [
    "fastapi[standard]>=0.161.1",
    "guardrails-ai>=0.11.0",
    "langchain>=1.3.10",
    "langchain-openai>=1.3.2",
    "langfuse>=4.17.0",
    "langgraph>=1.2.6",
    "pydantic>=2.13.5",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# the package folder is src/hiring_agent, which differs from the project name
[tool.uv.build-backend]
module-name = "hiring_agent"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# offline evals (DeepEval), experiment tracking (MLflow on DagsHub), noise thresholds
eval = [
    "dagshub>=0.7.3",
    "deepeval>=4.2.8",
    "mlflow>=3.17.2",
    "numpy>=2.5.3",
]
# the Streamlit app (it talks to the API with requests)
frontend = [
    "requests>=2.34.2",
    "streamlit>=1.62.0",
]

# `uv sync` / `uv run` locally and `uv sync --frozen` in CI still install everything
[tool.uv]
default-groups = ["dev", "eval", "frontend"]
