<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiring agent · Guarded data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --paper-2: #393e53; --ink: #f5f5f5; --muted: #bfc0c0;
      --soft: #949eb2; --rule: rgba(245,245,245,0.12); --accent: #f08a59;
      --accent-tint: rgba(240,138,89,0.10); --link: #739fdf;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 840px; }
    .note { margin-top: 1rem; color: var(--muted); font: italic 400 0.95rem/1.4 var(--serif); }
    .note a { color: var(--link); }
    .step-number, .step-label, .lane-label, .role-text, .chip-text { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · 1 of 2 · Overview</p>
    <h1>Hiring agent · How a task moves through the guarded graph</h1>

    <div class="scroll">
    <svg viewBox="0 0 840 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-dataflow-overview-title agent-dataflow-overview-desc">
      <title id="agent-dataflow-overview-title">Hiring agent guarded data flow</title>
      <desc id="agent-dataflow-overview-desc">The recruiter's task passes the input guard, the planner writes a plan, the action guard checks the plan before the executor runs it step by step through guarded tools, the score check adds correction steps for wrong scores, and the responder writes the answer; any blocked guard routes to a single fallback reply.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(245,245,245,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#bfc0c0"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#f08a59"/></marker>
      </defs>
      <rect width="840" height="356" fill="#2d3142"/>
      <rect width="840" height="356" fill="url(#dots)"/>
      <rect x="0" y="36" width="840" height="80" fill="rgba(245,245,245,0.025)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="840" y2="36" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="840" y2="276" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>

      <g aria-label="Run steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">CHECK TASK</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">PLAN</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(240,138,89,0.22)"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">CHECK PLAN</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">EXECUTE</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">VERIFY SCORES</text>
        <rect x="740" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="756" y="14" class="step-number">06</text><text x="756" y="29" class="step-label">RESPOND</text>
      </g>

      <g aria-label="Lanes">
        <text x="70" y="72" class="lane-label">GUARD</text><text x="70" y="84" class="lane-label">NODES</text>
        <text x="70" y="152" class="lane-label">AGENT</text><text x="70" y="164" class="lane-label">LLM NODES</text>
        <text x="70" y="232" class="lane-label">TOOL</text><text x="70" y="244" class="lane-label">CALLS</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <!-- input_guard ok -> planner -->
      <path d="M196 108 V148 Q196 156 204 156 H258" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <!-- input_guard exception -> guard_fallback -->
      <path d="M246 76 H258" fill="none" stroke="#bfc0c0" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
      <!-- planner -> action_guard (focal) -->
      <path d="M358 156 H412 Q420 156 420 148 V108" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <!-- action_guard exception -> guard_fallback -->
      <path d="M370 76 H358" fill="none" stroke="#bfc0c0" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
      <!-- action_guard ok -> executor -->
      <path d="M470 76 H508 Q516 76 516 84 V124" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <!-- executor <-> in-tool guards: call down, result up -->
      <path d="M516 188 V204" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <path d="M548 204 V188" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <!-- executor all steps done -> score_check -->
      <path d="M582 156 H636 Q644 156 644 148 V108" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <!-- score_check correction steps -> executor -->
      <path d="M594 92 H556 Q548 92 548 100 V124" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <!-- score_check none -> responder -->
      <path d="M694 76 H748 Q756 76 756 84 V124" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <!-- focal label, beside the vertical segment -->
      <rect x="428" y="122" width="32" height="12" rx="2" fill="#2d3142"/>
      <text x="444" y="131" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAN</text>

      <!-- GUARD: input_guard -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#2d3142"/>
      <rect x="146" y="44" width="100" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(245,245,245,0.12)"/><text x="159" y="53" class="role-text">GRD</text>
      <text x="196" y="67" class="node-title">Input guard</text><text x="196" y="79" class="node-sub">task · job description</text><text x="196" y="91" class="node-tool">Jev · L1 + L2</text>
      <rect x="150" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="158" y="104" class="chip-text">TX</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="234" y="104" class="chip-text">TX</text>

      <!-- GUARD: guard_fallback -->
      <rect x="258" y="44" width="100" height="64" rx="6" fill="#2d3142"/>
      <rect x="258" y="44" width="100" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="262" y="48" width="18" height="10" rx="3" fill="rgba(245,245,245,0.12)"/><text x="271" y="53" class="role-text">GRD</text>
      <text x="308" y="67" class="node-title">Guard fallback</text><text x="308" y="79" class="node-sub">one generic reply</text><text x="308" y="91" class="node-tool">reason → log · END</text>
      <rect x="338" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="346" y="104" class="chip-text">TX</text>

      <!-- GUARD: action_guard (focal) -->
      <rect x="370" y="44" width="100" height="64" rx="6" fill="#2d3142"/>
      <rect x="370" y="44" width="100" height="64" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1.2"/>
      <rect x="374" y="48" width="18" height="10" rx="3" fill="rgba(240,138,89,0.22)"/><text x="383" y="53" class="role-text focal-text">GRD</text>
      <text x="420" y="67" class="node-title">Action guard</text><text x="420" y="79" class="node-sub">≤ 2 deletes · protected</text><text x="420" y="91" class="node-tool">Jev · L3</text>
      <rect x="374" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="104" class="chip-text">PL</text>
      <rect x="450" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="458" y="104" class="chip-text">PL</text>

      <!-- GUARD: score_check -->
      <rect x="594" y="44" width="100" height="64" rx="6" fill="#2d3142"/>
      <rect x="594" y="44" width="100" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="598" y="48" width="18" height="10" rx="3" fill="rgba(245,245,245,0.12)"/><text x="607" y="53" class="role-text">GRD</text>
      <text x="644" y="67" class="node-title">Score check</text><text x="644" y="79" class="node-sub">re-score new rows</text><text x="644" y="91" class="node-tool">LLM + calculator · L4b</text>
      <rect x="598" y="98" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="104" class="chip-text">TB</text>
      <rect x="674" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="682" y="104" class="chip-text">PL</text>

      <!-- AGENT: planner -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#2d3142"/>
      <rect x="258" y="124" width="100" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(245,245,245,0.12)"/><text x="271" y="133" class="role-text">LLM</text>
      <text x="308" y="147" class="node-title">Planner</text><text x="308" y="159" class="node-sub">task + snapshot → plan</text><text x="308" y="171" class="node-tool">structured output</text>
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#6e6479"/><text x="270" y="184" class="chip-text">TX</text>
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="346" y="184" class="chip-text">PL</text>

      <!-- AGENT: executor -->
      <rect x="482" y="124" width="100" height="64" rx="6" fill="#2d3142"/>
      <rect x="482" y="124" width="100" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(245,245,245,0.12)"/><text x="495" y="133" class="role-text">LLM</text>
      <text x="532" y="147" class="node-title">Executor</text><text x="532" y="159" class="node-sub">1 plan step per visit</text><text x="532" y="171" class="node-tool">ReAct · 7 tools</text>
      <rect x="486" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="494" y="184" class="chip-text">PL</text>
      <rect x="562" y="178" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="570" y="184" class="chip-text">RS</text>

      <!-- AGENT: responder -->
      <rect x="706" y="124" width="100" height="64" rx="6" fill="#2d3142"/>
      <rect x="706" y="124" width="100" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="710" y="128" width="18" height="10" rx="3" fill="rgba(245,245,245,0.12)"/><text x="719" y="133" class="role-text">LLM</text>
      <text x="756" y="147" class="node-title">Responder</text><text x="756" y="159" class="node-sub">step results → answer</text><text x="756" y="171" class="node-tool">final reply · END</text>
      <rect x="710" y="178" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="718" y="184" class="chip-text">RS</text>
      <rect x="786" y="178" width="16" height="8" rx="3" fill="#6e6479"/><text x="794" y="184" class="chip-text">TX</text>

      <!-- TOOLS: in-tool guards -->
      <rect x="482" y="204" width="100" height="64" rx="6" fill="#2d3142"/>
      <rect x="482" y="204" width="100" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(245,245,245,0.12)"/><text x="495" y="213" class="role-text">TLS</text>
      <text x="532" y="227" class="node-title">In-tool guards</text><text x="532" y="239" class="node-sub">resume · draft · delete</text><text x="532" y="251" class="node-tool">Jev L2 · L4a · L3 cap</text>
      <rect x="486" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="494" y="264" class="chip-text">FL</text>
      <rect x="562" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="570" y="264" class="chip-text">FL</text>

      <!-- Legend: steps -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="rgba(245,245,245,0.12)"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Check task</text>
      <rect x="268" y="284" width="24" height="12" rx="6" fill="rgba(245,245,245,0.12)"/><text x="280" y="292" class="step-number">02</text><text x="300" y="293" class="legend-text">Plan</text>
      <rect x="332" y="284" width="24" height="12" rx="6" fill="rgba(240,138,89,0.22)"/><text x="344" y="292" class="step-number focal-text">03</text><text x="364" y="293" class="legend-text">Check plan</text>
      <rect x="420" y="284" width="24" height="12" rx="6" fill="rgba(245,245,245,0.12)"/><text x="432" y="292" class="step-number">04</text><text x="452" y="293" class="legend-text">Execute</text>
      <rect x="500" y="284" width="24" height="12" rx="6" fill="rgba(245,245,245,0.12)"/><text x="512" y="292" class="step-number">05</text><text x="532" y="293" class="legend-text">Verify scores</text>
      <rect x="600" y="284" width="24" height="12" rx="6" fill="rgba(245,245,245,0.12)"/><text x="612" y="292" class="step-number">06</text><text x="632" y="293" class="legend-text">Respond</text>

      <!-- Legend: data types -->
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="306" width="16" height="8" rx="3" fill="#6e6479"/><text x="188" y="312" class="chip-text">TX</text><text x="202" y="314" class="legend-text">Task / answer</text>
      <rect x="268" y="306" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="276" y="312" class="chip-text">PL</text><text x="290" y="314" class="legend-text">Plan steps</text>
      <rect x="344" y="306" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="352" y="312" class="chip-text">RS</text><text x="366" y="314" class="legend-text">Step results</text>
      <rect x="428" y="306" width="16" height="8" rx="3" fill="#9c6b50"/><text x="436" y="312" class="chip-text">FL</text><text x="450" y="314" class="legend-text">Resumes · drafts · files</text>
      <rect x="548" y="306" width="16" height="8" rx="3" fill="#b8915a"/><text x="556" y="312" class="chip-text">TB</text><text x="570" y="314" class="legend-text">Tracker rows</text>
      <text x="636" y="314" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="333" x2="204" y2="333" stroke="#bfc0c0" marker-end="url(#arr-muted)"/><text x="212" y="336" class="legend-text">Handoff (ok / next step)</text>
      <line x1="320" y1="333" x2="344" y2="333" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="352" y="336" class="legend-text">Focal handoff</text>
      <line x1="428" y1="333" x2="452" y2="333" stroke="#bfc0c0" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/><text x="460" y="336" class="legend-text">Blocked → guard fallback</text>
    </svg>
    </div>
    <p class="note">The executor loops on itself until every plan step has a result. Score check runs once; any correction steps it adds send the run back to the executor. <a href="guardrail_layers.html">Part 2 · what each guard checks →</a></p>
  </main>
</body>
</html>
