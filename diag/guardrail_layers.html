<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiring agent · Guardrail layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --paper-2: #393e53; --ink: #f5f5f5; --muted: #bfc0c0;
      --soft: #949eb2; --rule: rgba(245,245,245,0.12); --accent: #f08a59;
      --accent-tint: rgba(240,138,89,0.10); --link: #739fdf;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1000px; }
    .note { margin-top: 1rem; color: var(--muted); font: italic 400 0.95rem/1.4 var(--serif); }
    .note a { color: var(--link); }
    .col-head { fill: var(--soft); font: 500 8px var(--mono); letter-spacing: 0.18em; }
    .tag { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .layer-name { fill: var(--ink); font: 600 15px var(--sans); }
    .where { fill: var(--soft); font: 400 9px var(--mono); }
    .cell { fill: var(--muted); font: 400 9px var(--mono); }
    .fail { fill: var(--ink); font: 500 9px var(--mono); text-anchor: end; }
    .focal { fill: var(--accent); }
    .foot-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.18em; }
    .foot-text { fill: var(--muted); font: italic 400 11px var(--serif); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Control catalog · 2 of 2 · Guardrail layers</p>
    <h1>Hiring agent · What each guard checks, where, and what happens on fail</h1>

    <div class="scroll">
    <svg viewBox="0 0 1000 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="guardrail-layers-title guardrail-layers-desc">
      <title id="guardrail-layers-title">Hiring agent guardrail layers</title>
      <desc id="guardrail-layers-desc">Five guardrail layers in run order: task input, documents, actions, email drafts and tracker scores, each with where it is enforced, when it runs, what it checks, who decides and what happens when it fails; every Jev guard fails closed and every block returns the same generic reply.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/></pattern>
      </defs>
      <rect width="1000" height="472" fill="#2d3142"/>
      <rect width="1000" height="472" fill="url(#dots)" opacity="0.55"/>

      <!-- Run-order indicator (left margin) -->
      <text x="56" y="52" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="middle">START</text>
      <line x1="56" y1="60" x2="56" y2="368" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <polygon points="52,368 60,368 56,376" fill="#bfc0c0"/>
      <text x="56" y="392" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="middle">ANSWER</text>

      <!-- Column heads -->
      <text x="148" y="44" class="col-head">LAYER · ENFORCED IN</text>
      <text x="364" y="44" class="col-head">WHEN</text>
      <text x="500" y="44" class="col-head">CHECKS · THRESHOLD</text>
      <text x="704" y="44" class="col-head">DECIDED BY</text>
      <text x="960" y="44" class="col-head" text-anchor="end">ON FAIL</text>

      <!-- Stack hairlines -->
      <line x1="96" y1="56" x2="976" y2="56" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <line x1="96" y1="376" x2="976" y2="376" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>

      <!-- L1 · Task input -->
      <line x1="96" y1="120" x2="976" y2="120" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="112" y="84" class="tag">L1</text>
      <text x="148" y="86" class="layer-name">Task input</text>
      <text x="148" y="104" class="where">input_guard node</text>
      <text x="364" y="84" class="cell">start of every run</text>
      <text x="500" y="84" class="cell">jailbreak &gt; 0.8 · off-topic &lt; 0.3</text>
      <text x="500" y="100" class="cell">discriminatory &gt; 0.7</text>
      <text x="704" y="84" class="cell">Jev · 4 questions</text>
      <text x="704" y="100" class="cell">in 1 request</text>
      <text x="960" y="84" class="fail">block → fallback</text>

      <!-- L2 · Documents -->
      <line x1="96" y1="184" x2="976" y2="184" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="112" y="148" class="tag">L2</text>
      <text x="148" y="150" class="layer-name">Documents</text>
      <text x="148" y="168" class="where">input_guard · read_file</text>
      <text x="364" y="148" class="cell">JD: start of run</text>
      <text x="364" y="164" class="cell">resume: each read</text>
      <text x="500" y="148" class="cell">prompt injection &gt; 0.7:</text>
      <text x="500" y="164" class="cell">talks to the AI · asks to act</text>
      <text x="704" y="148" class="cell">Jev · 2 questions</text>
      <text x="704" y="164" class="cell">JD or resume wording</text>
      <text x="960" y="148" class="fail">JD: block → fallback</text>
      <text x="960" y="164" class="fail">resume: withheld</text>

      <!-- L3 · Actions (focal) -->
      <rect x="96" y="184" width="880" height="64" fill="rgba(240,138,89,0.12)"/>
      <rect x="96" y="184" width="880" height="64" fill="none" stroke="#f08a59" stroke-width="1"/>
      <text x="112" y="212" class="tag focal" font-weight="600">L3</text>
      <text x="148" y="214" class="layer-name">Actions</text>
      <text x="148" y="232" class="where">action_guard · delete_file</text>
      <text x="364" y="212" class="cell">plan: before step 1</text>
      <text x="364" y="228" class="cell">run: every delete</text>
      <text x="500" y="212" class="cell">&gt; 2 certain deletes · protected</text>
      <text x="500" y="228" class="cell">file (JD, tracker) · cap of 2</text>
      <text x="704" y="212" class="cell">Jev · 2 per step</text>
      <text x="704" y="228" class="cell">code counts</text>
      <text x="960" y="212" class="fail focal">plan: block → fallback</text>
      <text x="960" y="228" class="fail focal">delete: refused</text>

      <!-- L4a · Drafts -->
      <line x1="96" y1="312" x2="976" y2="312" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="112" y="276" class="tag">L4a</text>
      <text x="148" y="278" class="layer-name">Email drafts</text>
      <text x="148" y="296" class="where">draft_email tool</text>
      <text x="364" y="276" class="cell">before each save</text>
      <text x="500" y="276" class="cell">personal attribute &gt; 0.7</text>
      <text x="500" y="292" class="cell">extra contact details &gt; 0.7</text>
      <text x="704" y="276" class="cell">Jev · 2 questions</text>
      <text x="960" y="276" class="fail">draft not saved</text>

      <!-- L4b · Scores -->
      <text x="112" y="340" class="tag">L4b</text>
      <text x="148" y="342" class="layer-name">Tracker scores</text>
      <text x="148" y="360" class="where">score_check node</text>
      <text x="364" y="340" class="cell">once, after last step</text>
      <text x="500" y="340" class="cell">fit_score ≠ recomputed score</text>
      <text x="500" y="356" class="cell">row name ≠ resume owner</text>
      <text x="704" y="340" class="cell">LLM lists points</text>
      <text x="704" y="356" class="cell">calculator sums</text>
      <text x="960" y="340" class="fail">add correction step</text>
      <text x="960" y="356" class="fail">flag for hand review</text>

      <!-- Footer: rules shared by every layer, and the known gap -->
      <text x="96" y="412" class="foot-label">FAILS CLOSED</text>
      <text x="224" y="412" class="foot-text">If the Jev call fails (TypeSafeError), the guard blocks as if the check failed. An unchecked input never gets through.</text>
      <text x="96" y="432" class="foot-label">SAME REPLY</text>
      <text x="224" y="432" class="foot-text">Every block shows one generic message, so an attacker can't tell which check fired. The real reason goes only to the log.</text>
      <text x="96" y="452" class="foot-label">KNOWN GAP</text>
      <text x="224" y="452" class="foot-text">If a new row's resume can't be found, score_check skips that row and only logs a warning.</text>
    </svg>
    </div>
    <p class="note">L3 is enforced twice: the plan check can't count conditional deletes, so the run-time cap in delete_file catches them. <a href="agent_dataflow_overview.html">← Part 1 · the agent graph</a></p>
  </main>
</body>
</html>
